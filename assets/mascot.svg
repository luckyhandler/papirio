<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 300">
    <defs>
        <linearGradient id="fishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="55%" stop-color="#00f3ff"/>
            <stop offset="100%" stop-color="#b026ff"/>
        </linearGradient>
        <filter id="fishGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f3ff" flood-opacity="0.55"/>
        </filter>
    </defs>

    <g filter="url(#fishGlow)">
        <!-- Tail bristles (cerci), fanning out below the body -->
        <path d="M 58 208 C 45 240 35 260 24 285" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 61 208 L 61 282" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 64 208 C 77 240 87 260 98 285" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>

        <!-- Antennae, reaching up above the head -->
        <path d="M 50 67 C 38 42 28 22 14 4" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 70 67 C 78 47 88 30 98 15" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>

        <!-- Legs (three jointed pairs along the body) -->
        <path d="M 74 100 L 90 92 L 104 98" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 78 135 L 94 128 L 108 133" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 76 170 L 90 164 L 102 169" fill="none" stroke="url(#fishGradient)" stroke-width="2" stroke-linecap="round"/>

        <!-- Body: long tapering, segmented insect body, standing upright (head up) -->
        <path d="M 50 65 C 35 100 35 160 58 208 C 68 160 68 100 70 65 Z" fill="url(#fishGradient)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

        <!-- Segment lines across the body -->
        <path d="M 40 95 C 50 100 58 100 68 95" fill="none" stroke="#0a0b10" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 37 125 C 49 131 59 131 71 125" fill="none" stroke="#0a0b10" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 40 155 C 50 161 58 161 68 155" fill="none" stroke="#0a0b10" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 48 185 C 55 189 61 189 68 185" fill="none" stroke="#0a0b10" stroke-width="1" stroke-opacity="0.3"/>

        <!-- Eye -->
        <circle cx="53" cy="78" r="4.5" fill="#0a0b10"/>
        <circle cx="51.5" cy="76.5" r="1.4" fill="#ffffff"/>
    </g>
</svg>
